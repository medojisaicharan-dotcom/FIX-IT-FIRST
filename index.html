<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fix It First — The Canvas Protocol</title>
  <meta name="description" content="The Canvas Protocol Edition: Decision support for damaged items executed purely through Drag-and-Drop Action Zones. No standard action buttons.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

  <!-- Header Navigation -->
  <header class="border-b border-[var(--border-subtle)] bg-[var(--bg-surface)] sticky top-0 z-40 transition-colors shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Brand & Canvas Protocol Tag -->
      <a href="#" onclick="location.reload(); return false;" class="flex items-center gap-3 group text-decoration-none">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 text-white flex items-center justify-center font-black text-lg shadow-md shadow-emerald-600/30">
          🎨
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-black text-base md:text-lg leading-tight tracking-tight text-[var(--text-main)]">
              Fix It First
            </span>
            <span class="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400 border border-purple-500/30">
              Canvas Protocol
            </span>
          </div>
          <span class="block text-[11px] text-[var(--text-muted)] font-medium">
            Think before you throw.
          </span>
        </div>
      </a>

      <!-- Canvas Protocol Live Badge -->
      <div class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-[var(--bg-surface-elevated)] border border-[var(--border-subtle)] text-xs text-[var(--text-muted)]">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Drag Cards to Execute Actions</span>
      </div>

      <!-- Display Toggles -->
      <div class="flex items-center gap-2">
        <button 
          id="btnContrastToggle" 
          class="px-3 py-1.5 rounded-full border border-[var(--border-medium)] bg-[var(--bg-surface)] text-[var(--text-main)] text-xs font-semibold hover:border-emerald-500 transition cursor-pointer" 
          title="Toggle High Contrast Mode"
        >
          👁️ <span class="hidden sm:inline text-[11px]">Contrast</span>
        </button>

        <button 
          id="btnThemeToggle" 
          class="px-3 py-1.5 rounded-full border border-[var(--border-medium)] bg-[var(--bg-surface)] text-[var(--text-main)] text-xs font-semibold hover:border-emerald-500 transition cursor-pointer" 
          title="Toggle Dark / Light Theme"
        >
          🌙
        </button>
      </div>

    </div>
  </header>

  <!-- Interactive Canvas Workspace -->
  <main id="mainContent" class="max-w-7xl mx-auto px-4 py-6 min-h-[calc(100vh-120px)]">
    <!-- Rendered dynamically by app.js (Canvas Protocol) -->
  </main>

  <!-- Canvas Footer -->
  <footer class="border-t border-[var(--border-subtle)] bg-[var(--bg-surface)] py-5 text-center text-xs text-[var(--text-muted)] transition-colors">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p><strong>Fix It First</strong> · The Canvas Protocol Edition. Zero buttons for primary actions.</p>
      <p class="text-[11px] text-[var(--text-faint)]">Touch and Pointer drag-and-drop enabled.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
